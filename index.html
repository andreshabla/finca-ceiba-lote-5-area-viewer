<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>FINCA CEIBA LOTE 5 · Project Viewer</title>
<style>
/* FAMM presentation voice: black bar, paper plan, exact numbers.
   SD = colour-coded masses only. DD = colour coding over the full CAD drawing, to scale.
   Selection = red hatch + red outline laid over the unchanged base drawing. */
:root{--ink:#111;--mut:#6b6b6b;--line:#e4e2dc;--paper:#fbfaf7;--sheet:#fff;--red:#D7261E;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;font:15px/1.4 Roboto,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;color:var(--ink);display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
.bar{background:#000;color:#fff;padding:calc(10px + var(--st)) 14px 8px;display:flex;align-items:center;gap:12px;flex:none}
.bar img{height:38px;width:auto;display:block}
.bar .t{line-height:1.2;flex:1}.bar .t b{display:block;font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.bar .t span{display:block;font-size:12px;color:#bdbdbd}
.bar .t em{display:block;font-style:normal;font-size:10px;letter-spacing:.12em;color:#8f8f8f;margin-top:2px}
.ph{font-size:12px;font-weight:700;border:1px solid #fff;border-radius:6px;padding:8px 10px;min-height:36px;min-width:52px;letter-spacing:.08em}
.tabs{display:flex;background:#000;padding:0 8px 8px;overflow-x:auto;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;background:none;border:0;color:#9a9a9a;font-weight:600;font-size:13px;padding:9px 12px;border-bottom:2px solid #333;white-space:nowrap}
.tabs button.on{color:#fff;border-color:#fff}
.bub{display:flex;gap:8px;padding:10px 12px 6px;background:var(--paper);flex:none}
.bub>button,.bub>div{flex:1;border-radius:22px;padding:7px 12px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:#fff;color:#111;border:1.5px solid #111;transition:background .15s,color .15s}
.bub>.on{background:#111;color:#fff}
.bub small{font-size:10px;letter-spacing:.12em;font-weight:700;opacity:.75;display:flex;gap:6px;align-items:center}
.bub small i{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;display:inline-block}
.bub .on small i{background:currentColor}
.bub b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.bub b i{font-style:normal;font-size:12px;font-weight:500;margin-left:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 12px 8px;background:var(--paper);flex:none;scrollbar-width:none;border-bottom:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 10px;font-size:12.5px;white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip b{font-variant-numeric:tabular-nums;font-weight:700}
.chip.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);color:var(--red)}
.chip.x{opacity:.65}
#plan{flex:1;position:relative;background:var(--paper);overflow:hidden;touch-action:none}
#plan>svg{position:absolute;inset:0;width:100%;height:100%}
.tool{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.tool button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tool button.on{background:#111;color:#fff}
.sheet{position:absolute;left:0;right:0;bottom:0;height:88%;background:var(--sheet);border-radius:16px 16px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.14);z-index:3;display:flex;flex-direction:column;padding-bottom:var(--sb);will-change:transform}
.sheet.anim{transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.drag{flex:none;touch-action:none;cursor:grab}
.grab{padding:8px 0 4px;display:flex;justify-content:center}
.grab span{width:40px;height:5px;border-radius:3px;background:#d0cec8}
.hd{padding:2px 16px 10px;display:flex;align-items:flex-start;gap:10px}
.hd .x{flex:1}.hd b{font-size:16px;display:block;line-height:1.25}.hd div div{color:var(--mut);font-size:12.5px}
.hd .back{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 10px;font-size:12px;white-space:nowrap}
.bd{overflow:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch;flex:1;overscroll-behavior:contain}
.list{margin:0;padding:0;list-style:none}
.gh{display:flex;align-items:center;gap:8px;padding:12px 0 6px;border-bottom:1px solid #111;font-weight:700;font-size:13px;cursor:pointer}
.gh i{width:10px;height:10px;border-radius:50%}
.gh span{flex:1}.gh em{font-style:normal;font-variant-numeric:tabular-nums}
.gh.on{color:var(--red);border-color:var(--red)}
.it{display:flex;align-items:center;gap:8px;padding:9px 4px 9px 18px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
.it span{flex:1;line-height:1.3}.it small{display:block;color:var(--mut);font-size:11px}
.it em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:600}
.it.on{background:#fdecea;color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.it.on em{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:6px}
th{text-align:right;font-size:10.5px;letter-spacing:.08em;color:var(--mut);font-weight:700;padding:6px 0;border-bottom:1px solid #111}
th:first-child,td:first-child{text-align:left}
td{padding:6px 0;border-bottom:1px solid var(--line);text-align:right}
td i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}
th.m,td.m{color:#111;font-weight:700}
tr.tot td{font-weight:700;border-bottom:1.5px solid #111}
tr.ex td{color:var(--mut)}
.big{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 2px;color:var(--red)}
.big i{font-style:normal;font-size:15px;font-weight:500}
.alt{color:var(--mut);font-size:13px;margin-bottom:10px}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.kv span{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 10px;font-size:12.5px}
.foot{color:var(--mut);font-size:11.5px;margin-top:12px;line-height:1.5}
.warn{background:#fff6e5;border:1px solid #f0d9a8;border-radius:8px;padding:8px 10px;font-size:12px;margin-top:10px}
.warn summary{font-weight:700;cursor:pointer}
.sec{font-size:10.5px;letter-spacing:.1em;font-weight:700;color:var(--mut);margin:16px 0 2px}

/* program rail (replaces the bottom sheet): plan keeps its space, program swipes sideways */
.rail{flex:none;background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(8px + var(--sb));box-shadow:0 -4px 14px rgba(0,0,0,.06)}
.sel{display:flex;align-items:center;gap:10px;padding:2px 14px 8px;min-height:44px}
.sel .x{flex:1;line-height:1.25}.sel b{display:block;font-size:15px}.sel small{color:var(--mut);font-size:12px}
.sel .v{font-size:22px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}.sel .v i{font-style:normal;font-size:12px;font-weight:500}
.sel .v.k{color:#111}
.sel button{border:1px solid var(--line);background:#fff;border-radius:50%;width:30px;height:30px;font-size:13px;flex:none}
.cards{display:flex;gap:8px;overflow-x:auto;padding:0 14px 2px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.cards::-webkit-scrollbar{display:none}
.card{flex:none;scroll-snap-align:start;width:132px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 10px 8px 12px;text-align:left;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.card b{font-size:12.5px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px}
.card small{font-size:10.5px;color:var(--mut);letter-spacing:.02em}
.card em{font-style:normal;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}.card em i{font-style:normal;font-size:10px;font-weight:500;margin-left:1px}
.card.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);background:#fdf3f2}.card.on em,.card.on b{color:var(--red)}
.chip.all i{background:linear-gradient(135deg,#2B2B2B,#C9BFAE)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.ov .pn{background:#fff;width:100%;max-width:560px;max-height:82%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:var(--sb)}
.ov .hd{padding:14px 16px 8px}
.ov .bd{padding:0 16px 20px}
@media (min-width:900px){.card{width:160px}}
/* two states: strip (default, in flow) / full program (pulled up, overlays the plan) */
.rail .grab{padding:6px 0 4px;display:flex;justify-content:center;cursor:grab;touch-action:none}
.rail .grab span{width:40px;height:5px;border-radius:3px;background:#d0cec8}
.rail .sel{touch-action:pan-x}
.full{display:none;overflow:auto;flex:1;padding:0 16px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.rail.up{position:fixed;left:0;right:0;bottom:0;height:min(82vh,calc(100% - 120px));z-index:6;display:flex;flex-direction:column;border-radius:16px 16px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.22);animation:up .24s cubic-bezier(.2,.8,.2,1)}
.rail.up .cards{display:none}.rail.up .full{display:block}
@keyframes up{from{transform:translateY(40%);opacity:.6}to{transform:none;opacity:1}}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:5;display:none}.dim.show{display:block}
.lvh{display:flex;align-items:baseline;gap:8px;margin:18px 0 2px;padding-bottom:4px;border-bottom:2px solid #111}
.lvh b{flex:1;font-size:14px;letter-spacing:.06em;text-transform:uppercase}.lvh span{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.hint{font-size:11px;color:var(--mut);text-align:center;margin-top:-2px}
/* plan styles (px widths, non-scaling) */
.ln{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.heavy{stroke:#111;stroke-width:1.5}.medium{stroke:#333;stroke-width:.9}.thin{stroke:#8a8a8a;stroke-width:.5}
.dashed{stroke:#777;stroke-width:.6;stroke-dasharray:4 3}.property{stroke:#c0392b;stroke-width:1.1;stroke-dasharray:10 3 2 3}
.water{stroke:#2a86b8;stroke-width:.7}.green{stroke:#7f9d62;stroke-width:.45}.contour{stroke:#b9a68a;stroke-width:.5}
.poche_fill{fill:#1a1a1a}.water_fill{fill:#bfe1f2;opacity:.6}
.sp{vector-effect:non-scaling-stroke;stroke:#fff;stroke-width:.6}
.gr{fill:none;vector-effect:non-scaling-stroke;stroke-width:1.2;stroke-dasharray:6 3}
.selA{fill:url(#rh);stroke:var(--red);stroke-width:2.4;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
.selG{fill:url(#rh);stroke:var(--red);stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none;opacity:.85}
.lbl{font:600 .42px Roboto,Arial,sans-serif;fill:#111;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fbfaf7;stroke-width:.09px}
.lbl tspan.a{font-weight:400;fill:#444}.lbl.r,.lbl.r tspan.a{fill:var(--red)}
.cap{font:700 1.3px Roboto,Arial,sans-serif;fill:#111;letter-spacing:.05px}

/* ---- project viewer: stage menu (SD / DD / CD), CD base and specs */
.ph{background:none;color:#fff;cursor:pointer}
.stg{position:fixed;right:10px;top:calc(58px + var(--st));background:#111;border:1px solid #3a3a3a;border-radius:12px;z-index:30;display:none;flex-direction:column;min-width:230px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.stg.show{display:flex}
.stg button{background:none;border:0;border-bottom:1px solid #222;color:#bdbdbd;text-align:left;padding:11px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
.stg button b{color:#fff;width:26px}.stg button.on{background:#1d1d1d;color:#fff}
.stg small{margin-left:auto;font-size:9.5px;letter-spacing:.1em;color:#8f8f8f;border:1px solid #444;border-radius:8px;padding:1px 6px}
.stg small.lv{color:#7fd18b;border-color:#2f5a35}
.cdpoche{fill:#d6d2c9;pointer-events:none}
.cdline{fill:none;stroke:#9a958b;stroke-width:.55;vector-effect:non-scaling-stroke;pointer-events:none}
.cdthin{fill:none;stroke:#c2beb5;stroke-width:.4;vector-effect:non-scaling-stroke;pointer-events:none}
.mk{vector-effect:non-scaling-stroke;stroke:#fff;stroke-width:.9;cursor:pointer}
.inst{vector-effect:non-scaling-stroke;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:#111;color:#fff;font-size:12px;line-height:1.35;padding:6px 9px;border-radius:7px;max-width:250px;z-index:4;display:none}
.spimg{width:100%;max-width:240px;border-radius:10px;border:1px solid var(--line);margin:8px 0 4px;display:block}
.it img{width:40px;height:40px;object-fit:cover;border-radius:7px;border:1px solid var(--line);flex:none;background:#fff}
.it span b{font-weight:700;margin-right:4px}
.fresh{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:5;white-space:nowrap;background:var(--red);color:#fff;border:0;border-radius:18px;padding:8px 14px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.3);display:none}
.fresh.show{display:block}
.card.spc{width:150px}.card.spc img{width:100%;height:58px;object-fit:cover;border-radius:7px;margin-bottom:3px;background:#f4f2ee}
.card.spc b{min-height:0;font-size:14px}.card.spc small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:27px;line-height:1.25}
.card.spc em i.q{display:block;font-size:10.5px;color:var(--mut);font-weight:600;margin:1px 0 0}.card.off{opacity:.62}
.spd{display:flex;gap:12px;align-items:flex-start;margin-top:6px}.spd .spimg{width:120px;height:120px;object-fit:cover;margin:0;flex:none}
.spc0{font-size:10.5px;letter-spacing:.1em;font-weight:700;text-transform:uppercase}
.it i.sw{width:14px;height:14px;border-radius:4px;flex:none}
.tip{pointer-events:none}
.qap{color:var(--red);text-decoration:underline;cursor:pointer;font-weight:600}
.qal{margin:6px 0 0;padding-left:18px;font-size:12.5px;line-height:1.45}.qal li{margin:3px 0}
.kv span.bad{background:#fdecea;border-color:#f3b8b3;color:#a3201a}
.lyr .nm i.lw{font-style:normal;display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;border-radius:50%;background:#f0d9a8;color:#7a5200;font-size:10px;font-weight:800}
.tabs .pdd{flex:1 1 auto;display:flex;align-items:center;gap:8px;text-align:left;color:#fff;border-bottom:2px solid #fff;min-width:0}
.tabs .pdd span{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tabs .pdd small{font-size:10.5px;color:#8f8f8f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tabs .pdd i{font-style:normal;margin-left:auto}
.tabs .lvj{flex:0 0 auto;padding:9px 9px;font-size:12px}
.pmenu{position:fixed;left:8px;right:8px;top:calc(104px + var(--st));background:#111;border:1px solid #333;border-radius:12px;z-index:30;display:none;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:520px}
.pmenu.show{display:flex}.pmenu button{background:none;border:0;border-bottom:1px solid #222;color:#ddd;text-align:left;padding:11px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.pmenu button b{color:#fff;font-size:14px}.pmenu button small{grid-column:1;color:#8f8f8f;font-size:11px}.pmenu button em{grid-row:1/3;grid-column:2;display:flex;gap:3px;align-items:center}.pmenu button em i{width:10px;height:10px;border-radius:50%}
.pmenu button.on{background:#1d1d1d;box-shadow:inset 3px 0 0 var(--red)}
.lyr{flex:none;min-width:max-content;display:flex;align-items:center;border:1px solid var(--line);background:#fff;border-radius:16px;overflow:hidden}
.lyr .eye{flex:none;width:26px;align-self:stretch;border:0;background:none;position:relative}
.lyr .eye:after{content:'';position:absolute;left:9px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;border:2px solid var(--c)}
.lyr.act .eye:after{background:var(--c)}
.lyr .nm{flex:none;border:0;background:none;padding:5px 11px 5px 2px;font-size:12.5px;white-space:nowrap;color:#555}.lyr.act .nm{color:#111}.lyr .nm b{font-weight:700}
.lyr.lsel{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}.lyr.lsel .nm{color:var(--red)}
circle.mk{stroke:#fff;stroke-width:1.4;vector-effect:non-scaling-stroke}circle.mk.hit{stroke:none}circle.mk.nog{stroke-width:1.6;stroke-dasharray:2 2}circle.mk.r{stroke:#fff;stroke-width:2}circle.mk.me{stroke:#111;stroke-width:2.5}
.mkl{font-weight:700;font-family:Roboto,Arial,sans-serif;fill:#111;paint-order:stroke;stroke:#fbfaf7;stroke-width:3px;vector-effect:non-scaling-stroke;pointer-events:none}.mkl.r{fill:var(--red)}
.cdi{flex:1;display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid #111;border-radius:16px;padding:7px 8px 7px 12px;min-height:58px}
.cdi .x{flex:1;line-height:1.25}.cdi small{font-size:10px;letter-spacing:.1em;font-weight:700;color:var(--mut);display:block}
.cdi b{font-size:17px;font-weight:700;display:block}.cdi p{margin:2px 0 0;font-size:11.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cdi.sel{border-color:var(--red);align-items:flex-start}.cdi.sel img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none}
.cdi.sel p{color:#222;-webkit-line-clamp:3}.cdi .sw2{width:14px;height:64px;border-radius:6px;flex:none}
.cdi .fx{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.cdi .fx span{font-size:11px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1px 7px;font-weight:600}
.cdi .cx{border:1px solid var(--line);background:#fff;border-radius:50%;width:28px;height:28px;flex:none;font-size:12px}
.seg{display:flex;border:1px solid #111;border-radius:14px;overflow:hidden;flex:none}.seg button{border:0;background:#fff;font-size:11.5px;font-weight:600;padding:5px 9px}.seg button.on{background:#111;color:#fff}
.bub>.cdi{flex-direction:row;align-items:center;height:92px;overflow:hidden}   /* fixed: selecting never resizes the plan (no re-fit zoom) */.bub>.cdi.sel{align-items:flex-start}
/* door / window picker: one elevation tile per type of the Revit table */
.etg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:8px 0 4px}
.et{border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-height:44px}
.et img{width:100%;height:78px;object-fit:contain;background:#fff}.et .noel{width:100%;height:78px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11px;background:var(--paper);border-radius:6px}
.et b{font-size:14px}.et small{font-size:10.5px;color:var(--mut)}.et em{font-style:normal;font-size:11px;font-weight:700}.et em.bad{color:var(--red)}
.et.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}

    for(const st of ['contour','green','thin','dashed','water','medium','property','heavy'])if(Ln[st])h+=`<path class="ln ${st}" d="${Ln[st]}" pointer-events="none"/>`;

      const nm=s.name.split(' · ')[0];h+=`<text class="lbl${on?' r':''}" x="${s.lx}" y="${s.ly}"><tspan x="${s.lx}">${esc(nm.length>26?nm.slice(0,25)+'…':nm)}</tspan><tspan class="a" x="${s.lx}" dy=".5">${fmt(val(s))} m²</tspan></text>`}
    h+='</g>';x+=l.w+gap}
  vp.innerHTML=h;const lastL=ls[ls.length-1];return{w:offs[lastL.id]+lastL.w,h:Math.max(...ls.map(l=>l.h))}}
function box(){const r=$('plan').getBoundingClientRect();return{W:r.width,top:24,bottom:Math.max(r.height-10,144)}}
function fitTo(x0,y0,x1,y1,maxK){const b=box();const pad=18;const w=Math.max(x1-x0,.5),h=Math.max(y1-y0,.5);

function bboxOf(list){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const s of list){const o=offs[s.lv];if(o===undefined)continue;const n=s.gd.match(/-?\d+(\.\d+)?/g).map(Number);
  for(let i=0;i<n.length;i+=2){x0=Math.min(x0,n[i]+o);x1=Math.max(x1,n[i]+o);y0=Math.min(y0,n[i+1]);y1=Math.max(y1,n[i+1])}}return x0<1e9?[x0,y0,x1,y1]:null}
function zoomTo(list){const b=bboxOf(list);if(!b)return;const m=list.length===1?3:1.5;const bx=box();const kfit=Math.min((bx.W-36)/ext.w,(bx.bottom-bx.top-36)/ext.h);

const pts=new Map();let last=null,moved=0;

  if(last&&s.n===last.n){const dk=s.n>1?s.d/last.d:1;const r=svg.getBoundingClientRect();const cx=s.cx-r.left,cy=s.cy-r.top;
    const nk=Math.max(.2,Math.min(view.k*dk,4000));view.x=cx-(cx-view.x)*(nk/view.k)+(s.cx-last.cx);view.y=cy-(cy-view.y)*(nk/view.k)+(s.cy-last.cy);view.k=nk;
